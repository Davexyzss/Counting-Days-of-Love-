<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counting Days of Love 2.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* --- Biến CSS cho các Theme --- */
        :root {
            --bg-gradient: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            --glass-bg: rgba(255, 255, 255, 0.35);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-color: #333;
            --heart-color: #ff4757;
            --box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        [data-theme="blue"] {
            --bg-gradient: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.6);
            --text-color: #2c3e50;
            --heart-color: #ff6b81;
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #232526 0%, #414345 100%);
            --glass-bg: rgba(0, 0, 0, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-color: #f1f2f6;
            --heart-color: #ff4757;
            --box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        /* --- Reset & Base --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-gradient);
            color: var(--text-color);
            transition: background 0.6s ease;
            overflow: hidden;
        }

        /* --- Theme Selector --- */
        .theme-selector {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }
        .theme-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid white;
            cursor: pointer;
            transition: transform 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .theme-btn:hover { transform: scale(1.1); }
        .theme-btn.active { transform: scale(1.2); border: 2px solid var(--text-color); }
        .theme-btn.pink { background: #ff9a9e; }
        .theme-btn.blue { background: #a1c4fd; }
        .theme-btn.dark { background: #232526; }

        /* --- Glassmorphism UI --- */
        .glass-container {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: var(--box-shadow);
            width: 90%;
            max-width: 600px;
            animation: fadeIn 1s ease-out;
        }
        .title {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            margin-bottom: 30px;
        }

        /* --- Avatars --- */
        .avatars-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--glass-border);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .heart-pulse {
            font-size: 2.5rem;
            color: var(--heart-color);
            animation: pulse 1.2s infinite;
        }

        /* --- Counter --- */
        .counter {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        .time-box {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 12px;
            min-width: 80px;
            border: 1px solid var(--glass-border);
        }
        .time-box span {
            font-size: 2rem;
            font-weight: 600;
            display: block;
        }
        .time-box p {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.9;
        }

        /* --- Quote --- */
        .quote {
            font-style: italic;
            font-size: 1.1rem;
            opacity: 0.8;
        }

        /* --- Animations --- */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Responsive --- */
        @media (max-width: 500px) {
            .counter { flex-wrap: wrap; }
            .time-box { min-width: 45%; }
            .title { font-size: 2.8rem; }
        }
    </style>
</head>
<body>
    <div class="theme-selector">
        <button class="theme-btn pink active" data-theme="pink" title="Hồng Lãng Mạn"></button>
        <button class="theme-btn blue" data-theme="blue" title="Biển Xanh"></button>
        <button class="theme-btn dark" data-theme="dark" title="Chế Độ Tối"></button>
    </div>

    <div class="glass-container">
        <h1 class="title">Hành Trình Tình Yêu</h1>
        
        <div class="avatars-container">
            <div class="avatar-wrapper">
                <img src="https://via.placeholder.com/120x120/ffb6c1/ffffff?text=Boy" alt="Boy" class="avatar">
            </div>
            <div class="heart-pulse"><i class="fa-solid fa-heart"></i></div>
            <div class="avatar-wrapper">
                <img src="https://via.placeholder.com/120x120/ffb6c1/ffffff?text=Girl" alt="Girl" class="avatar">
            </div>
        </div>

        <div class="counter" id="counter">
            <div class="time-box"><span id="days">00</span><p>Ngày</p></div>
            <div class="time-box"><span id="hours">00</span><p>Giờ</p></div>
            <div class="time-box"><span id="minutes">00</span><p>Phút</p></div>
            <div class="time-box"><span id="seconds">00</span><p>Giây</p></div>
        </div>

        <p class="quote">"Yêu không phải là nhìn nhau, mà là cùng nhau nhìn về một hướng."</p>
    </div>

    <script>
        // Cài đặt ngày bắt đầu yêu nhau (Năm, Tháng - 1, Ngày, Giờ, Phút, Giây)
        const startDate = new Date('2023-01-01T00:00:00');

        function updateCounter() {
            const now = new Date();
            const difference = now - startDate;

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((difference / 1000 / 60) % 60);
            const seconds = Math.floor((difference / 1000) % 60);

            // Format thêm số 0 phía trước nếu dưới 10
            document.getElementById('days').innerText = days;
            document.getElementById('hours').innerText = hours.toString().padStart(2, '0');
            document.getElementById('minutes').innerText = minutes.toString().padStart(2, '0');
            document.getElementById('seconds').innerText = seconds.toString().padStart(2, '0');
        }

        // Cập nhật mỗi giây
        setInterval(updateCounter, 1000);
        updateCounter();

        // Logic đổi Theme và lưu vào LocalStorage
        const themeBtns = document.querySelectorAll('.theme-btn');
        const currentTheme = localStorage.getItem('theme') || 'pink';

        // Hàm áp dụng theme
        function applyTheme(themeName) {
            document.documentElement.setAttribute('data-theme', themeName);
            localStorage.setItem('theme', themeName);
            
            // Cập nhật trạng thái nút
            themeBtns.forEach(btn => {
                btn.classList.remove('active');
                if(btn.dataset.theme === themeName) {
                    btn.classList.add('active');
                }
            });
        }

        // Áp dụng theme đã lưu khi load trang
        applyTheme(currentTheme);

        // Bắt sự kiện click đổi theme
        themeBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const theme = e.target.dataset.theme;
                applyTheme(theme);
            });
        });
    </script>
</body>
</html>
